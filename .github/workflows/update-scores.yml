name: Update MHS Scores & Standings

on:
  schedule:
    # Morning runs (day after game): 7:00 AM, 10:00 AM, 11:00 AM EDT (11:00, 14:00, 15:00 UTC)
    # Evening runs (game days): 10:00 PM, 11:00 PM EDT (02:00, 03:00 UTC)
    - cron: '0 2,3,11,14,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest MaxPreps Data
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json standings.json players.json index.html
          if git diff --staged --quiet; then
            echo "No changes in scores, standings, or player stats."
          else
            git commit -m "Auto-update scores, standings & player stats from MaxPreps [skip ci]"
            git push
          fi
