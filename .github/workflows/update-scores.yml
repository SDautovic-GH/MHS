name: Update MHS Scores & Standings

on:
  schedule:
    # Run every hour during peak post-game completion windows:
    # 4 PM - 11 PM EDT (20:00 - 03:00 UTC) daily
    # Plus mid-day weekends (12 PM & 2 PM EDT / 16:00 & 18:00 UTC) and 9 AM EDT morning check
    - cron: '0 0,1,2,3,13,16,18,20,21,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest MaxPreps Data
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json standings.json index.html
          if git diff --staged --quiet; then
            echo "No changes in scores or standings."
          else
            git commit -m "Auto-update scores & standings from MaxPreps [skip ci]"
            git push
          fi
