name: Update MHS Scores & Standings

on:
  schedule:
    # Run at 02:00 UTC (10:00 PM EDT) and 14:00 UTC (10:00 AM EDT) daily
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest MaxPreps Data
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json standings.json index.html
          if git diff --staged --quiet; then
            echo "No changes in scores or standings."
          else
            git commit -m "Auto-update scores & standings from MaxPreps [skip ci]"
            git push
          fi
