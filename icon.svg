<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mhsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c0519" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Full bleed solid Melrose Red background: completely solid, no white borders, no transparent corners -->
  <rect width="512" height="512" fill="url(#mhsGrad)"/>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="205" fill="#ffffff" letter-spacing="4" filter="url(#dropShadow)">MHS</text>
</svg>
